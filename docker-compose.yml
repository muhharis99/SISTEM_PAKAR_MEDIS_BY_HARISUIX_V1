services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdss
      POSTGRES_USER: cdss
      POSTGRES_PASSWORD: cdss-dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdss -d cdss"]
      interval: 5s
      timeout: 5s
      retries: 10

  cdss-mata:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET: "GANTI_DENGAN_SECRET_PRODUKSI"
      VISION_ENABLED: "true"
      VISION_PROVIDER_URL: "http://host.docker.internal:11434/api/chat"
      VISION_MODEL: "qwen3-vl:4b"
      DATABASE_URL: "postgresql+psycopg2://cdss:cdss-dev-only@db:5432/cdss"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
